# doc-comments.md rule 2: the first line is one sentence saying what the caller
# gets, and it does not open "This function...". The opener is pure padding --
# the reader already knows what declaration the hover is attached to.
#
# ANCHORING, and it is not what it looks like. Vale segments a comment into
# MARKDOWN blocks before a rule sees it, so `^` is the start of a paragraph
# inside the hover, not the start of the hover and not the start of a source
# line. `(?m)^` would be per source line and would fire on every soft-wrapped
# continuation; a bare `^` and `\A` behave identically here. Both halves are
# pinned by SelfReferentialOpener.good.ts, whose two referring expressions each
# OPEN a source line mid-paragraph: silent under `^`, two findings under `(?m)^`.
# An earlier fixture put them mid-line, where the two anchors agree, so it
# pinned nothing -- caught in review, which is what a fixture is for.
#
# The anchor is what makes this rule shippable. Measured 2026-09-10 over the 264
# tracked `.ts` files minus src/catalyst and vale-styles, on the same token list:
# unanchored with `ignorecase` 25, unanchored case-sensitive 2, sentence-anchored
# (`(?:^|[.!?]\s+)`) 2, and this paragraph anchor 0. The two that survive sentence
# anchoring are boundary statements doc-comments.md rule 3 protects as interface
# facts -- a module saying which half of a job is not its own.
#
# So this rule ships at zero findings, one narrower than the design pass proposed:
# that one paired a sentence anchor with a verb list to keep exactly one hit, the
# second-sentence opener in is-strict-equal.ts. That hover was rewritten in the
# same review pass, so the narrower rule is not what cleared the finding.
extends: existence
message: "A hover's opening sentence says what the caller gets, not what the declaration is: drop the '%s' opener (doc-comments.md rule 2)."
level: warning
scope: text.comment.block.ts
raw:
  - '^This (function|hook|module|component|class|method|file|type|helper|constant|utility)\b'
