; Fixture harness for the JsDoc style. Run it with:
;
;   vale --config=vale-styles/fixtures/fixtures.vale.ini vale-styles/fixtures
;
; Every rule in ../JsDoc ships a `<Rule>.bad.ts` that must report exactly that
; rule, and a `<Rule>.good.ts` that must report nothing. A rule that matches
; nothing reports nothing and is indistinguishable from a clean codebase, so the
; bad fixture is what proves the rule works -- the same reasoning `ast-grep`'s
; rule-tests/ carries, and the reason `npm run ast-grep:rules` gates on a missing
; fixture.
;
; Vale's own `vale test` and its inline `tests:` key cannot do this job: `input:`
; is parsed as Markdown, so a comment-scoped rule never matches and the only test
; it can pass is a vacuous `want: ""`. Measured.
;
; StylesPath resolves relative to THIS file, so `..` is vale-styles/. That is
; deliberate: the harness needs no `.vale/`, so it runs in a fresh worktree
; before `vale sync`.

StylesPath = ..
MinAlertLevel = warning

[formats]
ts = md

[*.ts]
BasedOnStyles = JsDoc
