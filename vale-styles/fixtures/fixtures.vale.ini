; Fixture harness for the JsDoc style. Run it with:
;
;   vale --config=vale-styles/fixtures/fixtures.vale.ini vale-styles/fixtures
;
; Every rule in ../JsDoc ships a `<Rule>.bad.<ext>` that must report exactly that
; rule, and a `<Rule>.good.<ext>` that must report nothing. It ships that pair for
; EVERY extension its own `scope:` claims, and no more: which extensions a rule
; claims is a per-rule ruling, and prose.md's "Each rule declares its own
; extensions" carries the test. A rule that matches nothing reports nothing and is
; indistinguishable from a clean codebase, so the bad fixture is what proves the
; rule works -- the same reasoning `ast-grep`'s rule-tests/ carries, and the reason
; `npm run ast-grep:rules` gates on a missing fixture.
;
; A bad fixture may report the same rule more than once. BlockTagVocabulary.bad.tsx
; does: once from the JSDoc hover and once from the JSX block, which is the comment
; shape .ts has no counterpart for.
;
; Vale's own `vale test` and its inline `tests:` key cannot do this job: `input:`
; is parsed as Markdown, so a comment-scoped rule never matches and the only test
; it can pass is a vacuous `want: ""`. Measured.
;
; StylesPath resolves relative to THIS file, so `..` is vale-styles/. That is
; deliberate: the harness needs no `.vale/`, so it runs in a fresh worktree
; before `vale sync`.

StylesPath = ..
MinAlertLevel = warning

[formats]
ts = md
tsx = md

[*.{ts,tsx}]
BasedOnStyles = JsDoc

; The Instruction and Procedure styles' fixtures are Markdown, since their rules
; claim .md -- the role-file and article surface -- rather than block comments.
; Same contract as above: the bad fixture reports exactly its own rule, the good
; one reports nothing.
;
; A Procedure `.good.md` carries the DISCRIMINATING case, not merely clean prose.
; ProcedureLength.good.md holds a long bullet and a fenced numbered step, both of
; which the rule must decline; OneInstruction.good.md holds the list and
; specified-order shapes the STE rule wrongly flagged. A good fixture with no
; near-miss in it passes vacuously and proves nothing.
[*.md]
BasedOnStyles = Instruction, Procedure
