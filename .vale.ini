; Prose linting for the agent-facing docs. Report-only: nothing gates on Vale's exit
; code, and `engineering.md`'s convention for a report-only checker applies -- read the
; output, not `$?`. Note Vale's exit code is NOT a findings count: it is 1 both when a
; rule matched and when a file failed to parse, so the two are indistinguishable from
; `$?` alone. That is the fourth failure mode `mutation-testing.md` describes, in a new
; tool: a pipeline that reads only the status cannot tell "linted, found things" from
; "never linted anything".
;
; Vale is a Go binary, NOT an npm dependency, so `npm ci` does not reproduce it. A
; machine without it lints nothing, which reads exactly like a clean run. Setup:
;   brew install vale && vale sync
; `.vale/` is gitignored -- `vale sync` refetches it, and the package below is pinned
; so a refetch cannot drift. Do not repoint it at `releases/latest`.
;
; The style ships twelve rules: Ambiguity, Articles, Contractions, Dictionary,
; Gerunds, Modals, NounClusters, OneInstruction, ParagraphLength, PassiveVoice,
; ProcedureLength, SentenceLength. Only SentenceLength is enabled here, and the
; other eleven are disabled by name below rather than by omission, so adding a rule
; is a deliberate edit rather than a side effect of a package upgrade.
;
; Enabling one is a decision, not a default. Two reasons the eleven are off:
;   - Blast radius. At adoption, 65% of sentences in this corpus already exceeded
;     the 25-word cap. A checker whose findings nobody has budgeted to fix is a
;     checker that gets ignored, and an ignored report-only checker is worse than
;     none because it reads as coverage.
;   - STE.Dictionary specifically must stay off, and this one is not a judgement
;     call: it needs ASD-STE100's approved-word list, which is copyrighted and
;     which no open tool ships. The style substitutes plain English instead. A
;     governed accept.txt/reject.txt vocabulary is the replacement, and it is a
;     separate piece of work with its own ownership question.
;
; This comment is deliberately self-contained. It used to cite the idea file that
; scoped this work, which the slice is required to delete on landing -- so the only
; argument for eleven disabled rules would have left with it. `npm run reference-check`
; does not scan .ini, so nothing would have caught that.

StylesPath = .vale
MinAlertLevel = warning

Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

; SCOPED TO articles/, NOT to all of .claude/agents/, and that is a finding rather than
; a preference. Vale parses YAML front matter with a real YAML parser, and `architect.md`
; and `coder.md` both fail it -- their `description:` fields contain a literal ": " that
; a real parser reads as a nested mapping and refuses. Measured 2026-09-08 on vale 3.20.0:
; those two abort, `product.md`, `cleaner.md` and `hardener.md` parse clean.
;
; This is the SAME failure CLAUDE.md already records for `agent-doc-check`, which is why
; that checker uses a bespoke line-anchored reader instead of a YAML parser -- and it
; independently reproduces that entry's count of 2 of the 5 agent files.
;
; It matters more here than it looks: a single unparseable file aborts the WHOLE run with
; exit 1, so `vale .claude/agents/` currently lints nothing at all rather than skipping
; the two files. Widening this glob without first resolving that is how this config would
; come to report a confident zero. The articles carry no front matter and are unaffected.
[.claude/agents/articles/**/*.md]
BasedOnStyles = STE
STE.Ambiguity = NO
STE.Articles = NO
STE.Contractions = NO
STE.Dictionary = NO
STE.Gerunds = NO
STE.Modals = NO
STE.NounClusters = NO
STE.OneInstruction = NO
STE.ParagraphLength = NO
STE.PassiveVoice = NO
STE.ProcedureLength = NO

; Rationale sidecars keep the register STE has no vocabulary for. Sections stack in the
; order written and `BasedOnStyles` replaces rather than adjusts, so this strips the style
; back off rather than layering onto it. This section must stay LAST.
;
; The value is deliberately EMPTY, not `Vale`. Vale's own docs do not demonstrate the empty
; form; it was verified here on 2026-09-08 to yield 0 findings. `BasedOnStyles = Vale` was
; tried first and is wrong -- it enables the built-in style, whose `Vale.Spelling` and
; `Vale.Repetition` fire at ERROR severity on exactly the technical prose a sidecar exists
; to hold.
[.claude/agents/articles/**/*.rationale.md]
BasedOnStyles =
