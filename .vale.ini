; Prose linting for the agent-facing docs. Report-only: nothing gates on the exit code.
;
; READ `.claude/agents/articles/prose-linting.md` BEFORE ACTING ON A FINDING. Three of
; the six enabled rules apply mechanically and three are prompts to look; that article
; says which is which, and lists the exempt classes for each. The measurements behind every
; ruling, and the account of the rules rejected, are in `prose-linting.rationale.md`.
;
; Setup: `brew install vale && vale sync`. Vale is a Go binary, not an npm dependency,
; so `npm ci` does not install it and a machine without it lints nothing.
;
; Every rule the style ships is listed below with an explicit value. Disable by name,
; never by omission, so adding a rule to the package is a deliberate edit here.

; Two style paths, and the order is load-bearing. `vale-styles/` is TRACKED and
; holds this repo's own styles; `.vale/` is gitignored and is what `vale sync`
; writes to. Lookup is first-wins and `vale sync` targets the LAST path, so this
; one ordering does both jobs. A repo style must therefore never be named `STE`,
; `Slop` or `Std`.
;
; One caveat on the sync target: it is the last `StylesPath` UNLESS an
; already-installed package redirects it. The vale-llm-slop package ships
; `.vale-config/0-vale-llm-slop.ini` declaring its own `StylesPath = styles`, so a
; re-sync in a checkout that already has it writes to `.vale/.vale-config/styles`
; instead. Measured here 2026-09-10: both copies now exist. Harmless while they
; are the same package, and worth knowing before reading a stale style as live.
StylesPath = vale-styles
StylesPath = .vale
MinAlertLevel = warning

Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

; Comments in TypeScript are linted as Markdown. Without this mapping four of the
; six enabled rules silently do nothing while Contractions still fires, so the run
; reports findings and LOOKS alive -- the worst-shaped confident zero in
; prose-linting.md's list. Measured: 212 findings without it, 1,480 with it.
;
; Inert until a section names a .ts/.tsx file: with no [*.{ts,tsx}] section Vale gets 0
; files. Measured.
[formats]
ts = md
tsx = md

; Scoped to every agent-facing doc: the topic articles, the house-rules articles, and
; the five role files. The role files were out of scope until `lint-the-role-files`
; single-quoted two `description:` scalars that a real YAML parser refused -- Vale
; aborts the WHOLE run on one unparseable file, so those two were silencing every
; other file too. See prose-linting.md, "What is scoped, and what is not".
;
; `**` here rather than `*`: Vale's `*` already crosses `/`, so both forms reach the
; same files, and `**` is the form that reads correctly to someone carrying globSync's
; intuition from the ast-grep rule checker.
[.claude/agents/**/*.md]
BasedOnStyles = STE

; On. SentenceLength, ParagraphLength and Contractions are mechanical; the other three
; are prompts a person reads.
; ProcedureLength is re-levelled from its shipped `suggestion`, which MinAlertLevel
; would otherwise filter into silence.
STE.SentenceLength = warning
STE.ProcedureLength = warning
STE.OneInstruction = warning
STE.PassiveVoice = warning

STE.Contractions = warning
STE.ParagraphLength = warning

; Off. Modals, Ambiguity and Dictionary were tried and rejected on the record; the rest
; are untried. prose-linting.rationale.md carries the reason for each.
; The package also ships a `Slop` style of sixteen rules. It is off because BasedOnStyles
; names STE alone, but this file's own principle is to disable by name, so it is named:
; nothing from `Slop` has been tried or ruled on, and adopting any of it is a decision
; with its own measurement, not a default.
Slop = NO

STE.Ambiguity = NO
STE.NounClusters = NO
STE.Articles = NO
STE.Dictionary = NO
STE.Gerunds = NO
STE.Modals = NO

; CLAUDE.md is auto-loaded into every session and every subagent, so its prose is read
; more often than any article's. It is scoped here for that reason. It sits in its own
; section rather than joining the agent-docs glob above because it is not under `.claude/`.
[CLAUDE.md]
BasedOnStyles = STE
STE.SentenceLength = warning
STE.ProcedureLength = warning
STE.OneInstruction = warning
STE.PassiveVoice = warning
STE.Contractions = warning
STE.ParagraphLength = warning
Slop = NO
STE.Ambiguity = NO
STE.NounClusters = NO
STE.Articles = NO
STE.Dictionary = NO
STE.Gerunds = NO
STE.Modals = NO

; Module sidecars beside the source (`src/cellTiles.md` next to `src/cellTiles.ts`) are
; linted exactly like an article: their reading pattern is an article's, since whoever
; is holding a call site reads them to act. The `.rationale.md` half of that tier is
; exempt by the section below, which is later and therefore wins.
; The six `= NO` lines are REPEATED here rather than inherited, and that is not
; redundancy. `BasedOnStyles = STE` in this section enables the WHOLE style, and a
; `= NO` in an earlier section does not survive it. Measured 2026-09-09 against the
; landed config, by running vale twice over a throwaway `src/probe.md` carrying
; "may", "additional" and "e.g.": with the six lines present, 0 findings; with them
; omitted, 3 -- Modals, Dictionary and Ambiguity, all three ruled off elsewhere in
; this file. This is the same failure the exemption section below documents, in the
; opposite direction: there an enabled rule leaked IN, here a disabled one came back.
;
; The probe file is what the measurement needs, because a `.rationale.md` cannot show
; it: the section below re-scopes those files and wins, so all three sidecars in `src/`
; today read 0 either way. The lines protect the `<module>.md` half of the tier, which
; has no live instance yet.
[src/**/*.md]
BasedOnStyles = STE
STE.SentenceLength = warning
STE.ProcedureLength = warning
STE.OneInstruction = warning
STE.PassiveVoice = warning
STE.Contractions = warning
STE.ParagraphLength = warning
Slop = NO
STE.Ambiguity = NO
STE.NounClusters = NO
STE.Articles = NO
STE.Dictionary = NO
STE.Gerunds = NO
STE.Modals = NO

; JSDoc blocks in TypeScript, via the tracked `vale-styles/JsDoc` style. This
; section is what makes the `[formats] ts = md` mapping above do anything: with
; no `.ts` section Vale processes 0 files.
;
; Every rule here carries its own `scope:` IN ITS OWN RULE FILE, never from this
; config. The `Rule[param] = value` form works and is banned: RuleToParams is
; global rather than per-section, so a scope written inside one section silently
; changes that rule everywhere it is enabled, and two sections setting the same
; parameter resolve last-one-wins.
;
; Scope is strictly per extension. `text.comment.block.ts` never reaches a .tsx
; file and `text.comment.block.tsx` never reaches a .ts one -- measured. A list is
; OR, so a rule reaching both writes both. Without the second scope entry a
; component's JSDoc is handed to Vale and matches nothing, which reports zero and
; reads exactly like a clean file.
;
; WHICH EXTENSIONS A RULE CLAIMS IS A PER-RULE RULING, NOT A DEFAULT OF BOTH.
; `architect` rules it, the rule records the answer in its own header, and the
; test is whether the rule assumes the block comment is an interface doc. See
; `.claude/agents/articles/prose-linting.md`, "Each rule declares its own
; extensions". Read each rule's own header for its answer.
;
; A RULE OWES A FIXTURE PAIR FOR EVERY EXTENSION IT CLAIMS. Nothing checks this,
; and a claimed-but-unfixtured extension is untested.
;
; The section glob is `[*.{ts,tsx}]` -- brace expansion, measured to work here.
; `[*.ts]` does NOT match a .tsx file; the suffix has to be named.

[*.{ts,tsx}]
BasedOnStyles = JsDoc
JsDoc.BlockTagVocabulary = warning
JsDoc.SelfReferentialOpener = warning
JsDoc.ImplementationAltitude = warning
JsDoc.DeadIndexical = warning

; ---------------------------------------------------------------------------
; THREE EXEMPTIONS, and they sit BELOW the `[*.{ts,tsx}]` section that enables the
; JsDoc style, because sections stack and the LATER one wins per key. The
; `[*.{ts,tsx}]` glob reaches these paths too -- Vale's `*` crosses `/` -- so being
; last is the only thing that keeps deliberate bait out of a tracked-tree run.
; This banner read "ABOVE" while no `.ts` section existed to sit above; the
; sentence was self-contradictory and is corrected here.
;
; Two of them exist because somebody will type `vale .` rather than the tracked
; file list every verification names. Measured: a bare `vale .` at the repo root
; processes 916 files and reports the same findings once per checkout it walks
; into. `agent-doc-check` and `reference-check` already carry the
; `.claude/worktrees/` exclusion for exactly this reason; the Stryker sandbox is
; the new one.
;
; EMPTYING `BasedOnStyles` ALONE IS NOT ENOUGH, and it failed silently in that
; direction once -- see the sidecar section at the end of this file. An explicit
; `Rule = warning` in an earlier MATCHING section activates that rule by itself
; and survives into a later one. So every enabled rule is switched off by name.
;
; WHEN A RULE IS ADDED TO THE `[*.{ts,tsx}]` SECTION IT MUST BE ADDED TO ALL THREE
; OF THESE. Nothing checks that. This said `.ts` while that section named both
; extensions.

[vale-styles/fixtures/*]
BasedOnStyles =
JsDoc.BlockTagVocabulary = NO
JsDoc.SelfReferentialOpener = NO
JsDoc.ImplementationAltitude = NO
JsDoc.DeadIndexical = NO
STE.SentenceLength = NO
STE.ProcedureLength = NO
STE.OneInstruction = NO
STE.PassiveVoice = NO
STE.Contractions = NO
STE.ParagraphLength = NO

[.claude/worktrees/*]
BasedOnStyles =
JsDoc.BlockTagVocabulary = NO
JsDoc.SelfReferentialOpener = NO
JsDoc.ImplementationAltitude = NO
JsDoc.DeadIndexical = NO
STE.SentenceLength = NO
STE.ProcedureLength = NO
STE.OneInstruction = NO
STE.PassiveVoice = NO
STE.Contractions = NO
STE.ParagraphLength = NO

[.stryker-tmp*/*]
BasedOnStyles =
JsDoc.BlockTagVocabulary = NO
JsDoc.SelfReferentialOpener = NO
JsDoc.ImplementationAltitude = NO
JsDoc.DeadIndexical = NO
STE.SentenceLength = NO
STE.ProcedureLength = NO
STE.OneInstruction = NO
STE.PassiveVoice = NO
STE.Contractions = NO
STE.ParagraphLength = NO

; Rationale sidecars are exempt from every rule: they hold the dated-record register,
; which several of these rules fight. This section must stay LAST; sections stack, and
; the later one wins per key.
;
; TWO things are required here, and emptying BasedOnStyles alone is NOT enough.
; Measured 2026-09-08: with only `BasedOnStyles =` this section leaked 78 findings onto
; doc-comments.rationale.md, because an explicit `STE.Rule = warning` in the section
; above ACTIVATES that rule on its own and survives into this one -- BasedOnStyles
; replaces the style list, not the per-rule keys. It failed silently and in the
; dangerous direction. So each enabled rule is switched off again by name below.
;
; The empty value is still deliberate, and still not `Vale`: `= Vale` enables the
; built-in style and fires Spelling and Repetition at ERROR severity on exactly the
; technical prose a sidecar holds.
[**/*.rationale.md]
BasedOnStyles =
STE.SentenceLength = NO
STE.ProcedureLength = NO
STE.OneInstruction = NO
STE.PassiveVoice = NO
STE.Contractions = NO
STE.ParagraphLength = NO
