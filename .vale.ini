; Prose linting for the agent-facing docs. Report-only: nothing gates on the exit code.
;
; READ `.claude/agents/articles/prose.md` BEFORE ACTING ON A FINDING. Six rules are
; enabled on the prose surface and FIVE surface in a default run. All five now apply
; MECHANICALLY: three from `STE` (SentenceLength, ParagraphLength, Contractions) and two
; from this repo's own `Procedure` style, which replaced the last two `STE` prompts with
; script rules that read the list marker and the verb after the connective.
; `PassiveVoice` is the sixth, held at `suggestion` and so below `MinAlertLevel`;
; reach it with `vale --minAlertLevel=suggestion`. That article says which is which, lists
; the exempt classes for each, and carries the active-voice instruction that now stands in
; place of sweeping that rule. The measurements behind every ruling, and the account of the
; rules rejected, are in `prose.meta.md`.
;
; Setup: `brew install vale && vale sync`. Vale is a Go binary, not an npm dependency,
; so `npm ci` does not install it and a machine without it lints nothing.
;
; Every rule the style ships is listed below with an explicit value. Disable by name,
; never by omission, so adding a rule to the package is a deliberate edit here.

; Two style paths, and the order is load-bearing. `vale-styles/` is TRACKED and
; holds this repo's own styles; `.vale/` is gitignored and is what `vale sync`
; writes to. Lookup is first-wins and `vale sync` targets the LAST path, so this
; one ordering does both jobs. A repo style must therefore never be named `STE`,
; `Slop` or `Std`.
;
; One caveat on the sync target: it is the last `StylesPath` UNLESS an
; already-installed package redirects it. The vale-llm-slop package ships
; `.vale-config/0-vale-llm-slop.ini` declaring its own `StylesPath = styles`, so a
; re-sync in a checkout that already has it writes to `.vale/.vale-config/styles`
; instead. Measured here 2026-09-10: both copies now exist. Harmless while they
; are the same package, and worth knowing before reading a stale style as live.
StylesPath = vale-styles
StylesPath = .vale
MinAlertLevel = warning

Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

; Comments in TypeScript are linted as Markdown. Without this mapping four of the
; six enabled rules silently do nothing while Contractions still fires, so the run
; reports findings and LOOKS alive -- the worst-shaped confident zero in
; prose.md's list. Measured: 212 findings without it, 1,480 with it.
;
; Inert until a section names a .ts/.tsx file: with no [*.{ts,tsx}] section Vale gets 0
; files. Measured.
[formats]
ts = md
tsx = md

; Scoped to every agent-facing doc: the topic articles, the house-rules articles, and
; the five role files. The role files were out of scope until `lint-the-role-files`
; single-quoted two `description:` scalars that a real YAML parser refused -- Vale
; aborts the WHOLE run on one unparseable file, so those two were silencing every
; other file too. See prose.md, "What is scoped, and what is not".
;
; `**` here rather than `*`: Vale's `*` already crosses `/`, so both forms reach the
; same files, and `**` is the form that reads correctly to someone carrying globSync's
; intuition from the ast-grep rule checker.
[.claude/agents/**/*.md]
BasedOnStyles = STE

; The Instruction style (vale-styles/Instruction/, tracked, authored by `architect`
; like JsDoc) is the regrowth guard for role files stripped to instruction under the
; user's 2026-09-11 ruling. Three rules: ListItemSentences and ParagraphSentences
; catch exposition that is long, HistoricalNarration catches exposition that is short.
; Each rule's own header carries its threshold argument and measurements.
;
; Enabled on this glob now that all five role files are stripped, and switched off by
; name for `articles/` below. Vale's `*` crosses `/`, so this glob reaches the articles
; and the sidecars as well as the role files and `architect/`'s mode files; the articles
; are a different register and carry an untriaged backlog.
;
; Explicit per-rule keys, deliberately NOT added to `BasedOnStyles`: a second style
; there would re-enable the whole STE style and destroy the six `= NO` keys below,
; per the measurement in the [src/**/*.md] comment.
Instruction.ListItemSentences = warning
Instruction.ParagraphSentences = warning
Instruction.HistoricalNarration = warning

; The Claim style (vale-styles/Claim/, tracked, authored by `architect` like JsDoc)
; mechanises the three claim-discipline forms that leave a phrase-level fingerprint:
; a consumer roster ("The audience is..."), a wording-identity attribution ("in its
; own words"), and an unmeasured majority (a sentence fronted with "Most"). Each
; rule's own header carries its dated corpus precision run. Measured 2026-09-15:
; zero findings on this surface outside articles/, which the next section carves
; out per rule with its counts. Explicit per-rule keys, deliberately NOT a second
; style in BasedOnStyles, same reasoning as the Instruction keys above.
Claim.AudienceRoster = warning
Claim.WordingIdentity = warning
Claim.SentenceInitialMost = warning

; On. SentenceLength, ParagraphLength and Contractions are mechanical; ProcedureLength
; and OneInstruction are prompts a person reads.
; ProcedureLength is re-levelled UP from its shipped `suggestion`, which MinAlertLevel
; would otherwise filter into silence.
;
; PassiveVoice is re-levelled DOWN, the only rule held below MinAlertLevel. Measured
; 2026-09-12: 490 findings, 9 of them the act-on class the article names -- 1.8 percent.
; A rule nobody can clear trains its readers to skim, and that cost falls on every other
; rule in the same run. It stays named and reachable rather than disabled, so
; `vale --minAlertLevel=suggestion` still asks the question on demand. The standing
; instruction in prose.md -- write in the active voice -- is what replaces the sweep.
; Ruled by the user 2026-09-12; prose.meta.md carries the measurement.
STE.SentenceLength = warning
; Replaced by the Procedure style below -- a script rule that reads the list MARKER,
; which STE cannot. Disabled by name, per this file's own principle. Do not re-enable
; alongside: two rules reporting one defect at different precisions is the drift the
; swap exists to prevent.
STE.ProcedureLength = NO
STE.OneInstruction = NO
Procedure.ProcedureLength = warning
Procedure.OneInstruction = warning
STE.PassiveVoice = suggestion

STE.Contractions = warning
STE.ParagraphLength = warning

; Off. Modals, Ambiguity and Dictionary were tried and rejected on the record; the rest
; are untried. prose.meta.md carries the reason for each.
; The package also ships a `Slop` style of sixteen rules. It is off because BasedOnStyles
; names STE alone, but this file's own principle is to disable by name, so it is named:
; nothing from `Slop` has been tried or ruled on, and adopting any of it is a decision
; with its own measurement, not a default.
Slop = NO

STE.Ambiguity = NO
STE.NounClusters = NO
STE.Articles = NO
STE.Dictionary = NO
STE.Gerunds = NO
STE.Modals = NO

