id: no-aliveness-by-paint-class-tsx
language: Tsx
severity: warning
message: Read cell aliveness through src/test-support/cellQuery.ts, not through the bg-gray-900/bg-white paint class.
note: >-
  The TSX half of no-aliveness-by-paint-class. See the -ts twin's note for the full argument: a
  cell's aliveness has an accessible representation (aria-pressed on the Cell button), the Tailwind
  background class is PAINT, and reading it as an aliveness predicate couples a black-box layer to
  a styling decision it has no business knowing.
# WHY THIS TWIN EXISTS. The -ts rule was written when features/ held no .tsx file at all, and its
# own comment pre-committed the first slice to add one to add this twin -- black-box-acceptance-
# pilot, which did. features/*.ts does NOT match a .tsx path (the glob must match the whole path,
# and '.tsx' does not end in '.ts'), so without this file the black-box modules -- today
# features/cell-life-and-death.steps.test.tsx plus the harness under features/harness/ -- would sit
# in exactly the layer that rule polices while being invisible to it. That hole opens silently: a
# feature converts to the black-box form by being RENAMED .steps.test.ts -> .steps.test.tsx, so
# every future conversion drops out of the -ts rule's coverage at the moment of the rename, with
# nothing failing. Six conversions are queued behind that pilot.
#
# THE GLOB REACHES features/harness/, MEASURED RATHER THAN ASSUMED. ast-grep's `*` crosses '/', so
# 'features/*.tsx' below matches features/harness/board.tsx and features/harness/<feature>.tsx as
# well as a file at features/ root -- confirmed against ast-grep 0.45.1 with a throwaway probe
# during split-acceptance-harness's design pass, which is what let that slice add a subdirectory
# without touching this rule. It is recorded HERE, and not only in the sibling rule that shares the
# probe, because this rule's own files: entry is the thing the measurement is about: a per-feature
# harness is covered by this rule the day it lands, and a reader wondering whether the new
# directory kept that cover should not have to find the answer in another file.
#
# ast-grep parses TypeScript and TSX with different parsers and a rule is bound to one of them, so
# the matcher below is duplicated from the -ts twin by necessity -- the same near-duplication
# no-manual-memo-ts / -tsx and no-test-support-in-product-ts / -tsx already carry.
#
# NO perf/*.tsx ENTRY, deliberately, even though the -ts twin covers perf/*.ts: perf/ holds no .tsx
# file, and npm run ast-grep:rules fails on a files: glob that resolves to nothing. Whichever slice
# first adds one adds the entry.
files:
  - 'features/*.tsx'
rule:
  any:
    # Both literal forms these sites take. A regex literal is its own node kind and is NOT reached
    # by `kind: string` -- see the -ts twin, where that was measured against this repo's own tree.
    - kind: string
      regex: 'bg-gray-900|bg-white'
    - kind: regex
      regex: 'bg-gray-900|bg-white'
