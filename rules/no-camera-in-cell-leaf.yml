id: no-camera-in-cell-leaf
language: Tsx
severity: warning
message: The per-cell leaf component must not import Camera -- it takes pan-stable scalars instead.
note: >-
  A Camera's identity changes on every pointermove during a pan. Cell.tsx is the base of the
  render tree -- one instance per mounted cell -- so a Camera-typed prop down there, value OR
  type, would put a per-pan-tick identity on every mounted cell and re-render all of them even
  though no cell's own world position moved. Positions reach this component as finished scalars
  derived once, one level up, from cellAnchor.ts's anchorOffsetPx/cellOffsetPx. If you need
  camera-exact geometry down here, you want PatternPreview.tsx's shape instead -- a sibling
  *outside* the transformed layer, bounded by the armed pattern's own size rather than by the
  viewport.
# SCOPE IS ONE CONCRETE FILE PATH ON PURPOSE, the same fragility no-logic-in-composition-root.yml
# carries and for the same reason: the invariant is about this specific leaf, not about
# src/components/ generally -- Grid.tsx, PatternPreview.tsx and LifeBoard.tsx all import Camera
# legitimately, so a directory-wide rule would have a non-clean baseline and train people to
# ignore its output. `npm run ast-grep:rules` fails if the path stops resolving, so a rename
# surfaces as a gate failure rather than as silence.
#
# CellTile.tsx WAS THE SECOND PATH HERE and was dropped by collapse-dead-cell-layer's DESIGN
# pass, deliberately ahead of the deletion rather than after it. That slice removes the
# per-dead-cell mount, which makes the tile wrapper redundant and deletes the file; a `files:`
# entry naming a deleted path fails this repo's rule gate, and `coder` cannot edit rules/ to
# clear it. Narrowing here first means the glob resolves on every intermediate tree in that
# slice's ordering. The interim exposure is one component nobody edits except to delete it.
# The invariant itself is unchanged and still lands on the right file: whatever mounts the
# cells, Cell.tsx is the leaf, and the leaf is what a Camera prop would multiply.
files:
  - 'src/components/Cell.tsx'
# Metavariables do not interpolate inside string literals, so an import PATH has to be matched
# with kind: + regex: rather than with a pattern -- two of this repo's rules were silently inert
# for exactly that mistake. `files:` above pins the match to src/components/, so the relative
# specifier is always '../camera'; the trailing quote in the regex stops it also matching a
# hypothetical '../cameraFoo'. Deliberately matches `import type { Camera }` as well as a value
# import: a type-only import is precisely how a Camera prop gets reintroduced.
rule:
  kind: import_statement
  regex: 'from [''"]\.\./camera[''"]'
