id: no-domain-imports-in-bdd-steps
valid:
  - import { createBdd } from 'playwright-bdd'
  - import { expect, type Page } from '@playwright/test'
  - import { CENTER, clickCell } from '../e2e-helpers'
  # The explicit-extension form. Both spellings are live in this repo -- e2e-helpers.ts imports
  # '../src/test-support/cellQuery.ts' with the extension, the step modules import without it -- so
  # allowing only one would be a rule about house style rather than about the boundary.
  - import { cellState } from '../e2e-helpers.ts'
  # The multi-line brace form every step module in the directory actually uses -- the one a
  # statement-level regex would be most likely to get wrong.
  - |
    import {
      aliveCellCount,
      CENTER,
      thumbTrackFraction,
    } from '../e2e-helpers'
  # Ordinary module-local exports: no import path at all, so not this rule's business. These are
  # what the `has: { field: source }` constraint exists for -- a bare kind: export_statement match
  # would report both.
  - export const FILLS_TRACK = 0.99
  - |
    export function expectThumbFillsTrack() {
      return true
    }
  # Not an import statement: a bare string naming a domain module is not a finding.
  - const NOT_AN_IMPORT = '../../src/gameOfLife'
invalid:
  # The direct route, and its type-only twin -- a type import leaks the domain vocabulary just as
  # surely, and costs nothing to write.
  - import { toggleCell } from '../../src/gameOfLife'
  - import type { Camera } from '../../src/camera'
  - import { cellLabel } from '../../src/test-support/cellQuery'
  - export { cellLabel } from '../../src/test-support/cellQuery'
  # Side-effect import: no bindings, so a matcher keyed on the import clause would miss it.
  - import '../../src/liveCellSeed'
  # Reaching past the barrel into the screenplay modules it re-exports. This case used to name
  # features/harness/board -- the JSDOM acceptance layer's infrastructure, "right repo, wrong
  # runner" -- and was repointed by delete-step-test-layer when that directory ceased to exist.
  # The replacement is the live temptation rather than a dead path: features/screenplay/ is real,
  # and e2e-helpers.ts is a pure re-export of it, so importing a sibling module directly looks
  # harmless and is exactly what the mandated-single-entry-point allowlist exists to stop.
  - import { cellLocator } from '../screenplay/elements'
  # Step module importing step module: the registry is global, so this dresses a registry fact up
  # as a module dependency. bddgen is what checks the sharing; an import does not.
  - import { zoomIn } from './camera-pan-and-zoom'
  # Traversal through the allowlisted prefix -- stopped by the anchored regex, not by convention.
  - import { toggleCell } from '../e2e-helpers/../src/gameOfLife'
  # Anything else at all. A step module needs three imports; a fourth is a design question, and
  # this is where it gets asked.
  - import { readFileSync } from 'node:fs'
