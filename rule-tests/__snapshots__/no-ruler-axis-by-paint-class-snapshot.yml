    labels:
    - source: /span\[class\*="top-0.5"\]/
      style: primary
      start: 14
      end: 41
  const X_AXIS_CLASS = /top-0\.5/:
    labels:
    - source: /top-0\.5/
      style: primary
      start: 21
      end: 31
