id: no-ruler-axis-by-paint-class
valid:
  # The accessible route, which is what a black-box layer should read.
  - import { rulerGroupLabel } from '../src/test-support/rulerQuery.ts'
  # Double-quoted because a plain YAML scalar containing ": " parses as a mapping.
  - "return page.getByRole('group', { name: rulerGroupLabel(axis) })"
  - const texts = await rulerGroup(page, 'x').getByText(/^-?\d+$/).allTextContents()
  # A different Tailwind class is not this rule's business -- see the note on why the regex
  # deliberately covers top-0.5/left-0.5 and nothing else.
  - const MAJOR = /border-l-gray-400/
  - const badge = page.locator('span[class*="top-2"]')
invalid:
  # The two forms that actually lived in features/e2e-helpers.ts before the affordance landed.
  - return page.locator('span[class*="top-0.5"]')
  - return page.locator('span[class*="left-0.5"]')
  - const X_AXIS_CLASS = /top-0\.5/
  - const Y_AXIS_CLASS = /left-0\.5/
  # The same two class names through RegExp(), where the backslash is doubled again.
  - const X_AXIS_RE = new RegExp('top-0\\.5')
  - const Y_AXIS_RE = new RegExp('left-0\\.5')
  # And unescaped inside a regex literal, where the dot is a wildcard but the text is the same.
  - const LOOSE = /span\[class\*="top-0.5"\]/
  - expect(label.className).toContain('top-0.5')
  - return ((await locator.getAttribute('class')) ?? '').includes('left-0.5')
