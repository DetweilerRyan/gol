id: no-aliveness-by-paint-class-tsx
valid:
  # The accessible representation, which is what a black-box layer should read.
  - const ALIVE = 'button[aria-label^="Cell "][aria-pressed="true"]'
  - expect(board.stateAt(0, 0)).toBe('alive')
  # A different paint class is not this rule's business -- see the -ts twin's note on why the regex
  # deliberately covers bg-gray-900/bg-white and nothing else.
  - const MAJOR = /border-l-gray-400/
invalid:
  - const ALIVE_CLASS = /bg-gray-900/
  - const DEAD_CLASS = /bg-white/
  - const ALIVE_SELECTOR = 'button.bg-gray-900'
  - expect(cell.className).toContain('bg-gray-900')
