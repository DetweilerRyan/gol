id: no-dead-doc-on-annotated-return-literal
valid:
  # Inferred return: the property doc is the one that reaches a destructured caller. Measured.
  - |
    export function useThing() {
      return {
        /** Reaches -- nothing declares a return type, so the literal is the shape. */
        alpha: 1,
      }
    }
  - |
    export const useThing = () => {
      return {
        /** Reaches -- same, in arrow form. */
        alpha: 1,
      }
    }
  # Nested: the ANNOTATED function is the outer one, but the literal belongs to the inner
  # arrow, whose return is inferred. This pins the neighbor-scoped `inside` chain -- a
  # `stopBy: end` anywhere in the rule reports this line and would be wrong.
  - |
    export function useThing(): View {
      const build = () => {
        return {
          /** Reaches -- `build`'s own return is inferred. */
          alpha: 1,
        }
      }
      return build()
    }
  # An implementation comment inside an annotated return literal is correct placement, not a
  # violation: it was never trying to reach a hover. The rule targets JSDoc only.
  - |
    export function useThing(): View {
      return {
        // stays // -- an implementation note, on the channel that costs a caller nothing
        alpha: 1,
      }
    }
  # An annotated `function_expression`'s inferred twin. Each of the util's six kinds carries a
  # negative here as well as a positive below, or a branch could be firing for the wrong
  # reason: this is the third (function_declaration and arrow are the first two cases above).
  - |
    export const build = function () {
      return {
        /** Reaches -- no annotation. */
        alpha: 1,
      }
    }
  # A class `method_definition`'s unannotated twin, completing the negative side: the util's
  # six kinds each need a negative as well as a positive, or a branch could be firing for the
  # wrong reason and a `valid:` case cannot tell you which.
  - |
    export class Thing {
      build() {
        return {
          /** Reaches -- no annotation. */
          alpha: 1,
        }
      }
    }
  # The two generator kinds' unannotated twins. `function*` is generator_function_declaration
  # and `const f = function*` is generator_function -- distinct kinds, both added to the util
  # after they were measured to produce no finding at all while annotated (fail-open).
  - |
    export function* build() {
      return {
        /** Reaches -- unannotated generator_function_declaration. */
        alpha: 1,
      }
    }
  - |
    export const build = function* () {
      return {
        /** Reaches -- unannotated generator_function. */
        alpha: 1,
      }
    }
  # Async without an annotation. Measured, not assumed: `await` at a destructured call site
  # does NOT sever a property doc on its own -- only the annotation does.
  - |
    export async function useThing() {
      return {
        /** Reaches -- inferred async return. */
        alpha: 1,
      }
    }
invalid:
  # Named interface return -- doc-comments.md rule 8's measured row.
  - |
    export function useThing(): View {
      return {
        /** Severed -- `View`'s member is the only site that reaches a caller. */
        alpha: 1,
      }
    }
  # Inline type-literal annotation -- measured while authoring this rule.
  - |
    export function useThing(): { alpha: number } {
      return {
        /** Severed -- the annotation need not be named for the doc to go dark. */
        alpha: 1,
      }
    }
  # Annotated arrow, block body.
  - |
    export const useThing = (): View => {
      return {
        /** Severed. */
        alpha: 1,
      }
    }
  # Annotated arrow, expression body -- the one shape with no return_statement to hang off.
  - |
    export const useThing = (): View => ({
      /** Severed. */
      alpha: 1,
    })
  # Two more kinds the `annotated-function` util names. Fixtured rather than inferred: a
  # `has:` that is wrong for a node shape makes its branch silently inert, and ast-grep test
  # passes identically whether a `valid:` branch works or is dead.
  - |
    export const build = function (): View {
      return {
        /** Severed -- function_expression. */
        alpha: 1,
      }
    }
  - |
    export class Thing {
      build(): View {
        return {
          /** Severed -- class method_definition. */
          alpha: 1,
        }
      }
    }
  - |
    export const bag = {
      build(): View {
        return {
          /** Severed -- object-literal method, the same method_definition kind. */
          alpha: 1,
        }
      },
    }
  # Annotated async. Measured through `await` at a destructured call site, in the same round
  # as the unannotated async negative above: the property doc is SEVERED and the doc on
  # `View`'s own member reaches. The rule fires on ordinary async feature work, so this shape
  # is pinned rather than left to the reader.
  - |
    export async function useThing(): Promise<View> {
      return {
        /** Severed -- the annotation severs it through the Promise too. */
        alpha: 1,
      }
    }
  # The two generator kinds. Both produced NO finding before they were added to the util --
  # the fail-open direction, where a rule checking nothing reads like a rule finding nothing.
  - |
    export function* build(): Generator<View> {
      return {
        /** Severed -- generator_function_declaration. */
        alpha: 1,
      }
    }
  - |
    export const build = function* (): Generator<View> {
      return {
        /** Severed -- generator_function. */
        alpha: 1,
      }
    }
  # `async function*` is the same generator_function_declaration kind rather than a kind of
  # its own -- pinned so a later reader does not go looking for an async generator branch.
  - |
    export async function* build(): AsyncGenerator<View> {
      return {
        /** Severed -- async generator, still generator_function_declaration. */
        alpha: 1,
      }
    }
